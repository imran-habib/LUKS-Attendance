name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Embed build SHA
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          Set-Content -Path "build_sha.txt" -Value $sha

      - name: Restore
        run: dotnet restore LuksAttendance.sln

      - name: Run tests
        run: dotnet test tests/LuksAttendance.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish LuksAttendance.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Copy SHA to publish
        run: Copy-Item "build_sha.txt" "./publish/build_sha.txt"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "LUKS Attendance v3.2.0 (build ${{ github.sha }})"
          body: "Automated build from commit ${{ github.sha }}. Download the .exe below — no installation needed, just run it."
          files: ./publish/LUKS-Attendance.exe
          make_latest: true

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: LUKS-Attendance
          path: |
            ./publish/LUKS-Attendance.exe
            ./publish/build_sha.txt
