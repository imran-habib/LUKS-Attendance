name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version
        id: version
        run: |
          $ver = (Select-Xml -Path LuksAttendance.csproj -XPath '//Version').Node.InnerText
          $sha = "${{ github.sha }}".Substring(0,7)
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "SHA=$sha" >> $env:GITHUB_OUTPUT
          Set-Content -Path "build_sha.txt" -Value $sha

      - name: Restore
        run: dotnet restore LuksAttendance.sln

      - name: Run tests
        run: dotnet test tests/LuksAttendance.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish LuksAttendance.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Rename exe with version
        run: |
          Copy-Item "build_sha.txt" "./publish/build_sha.txt"
          Rename-Item "./publish/LUKS-Attendance.exe" "LUKS-Attendance_v${{ steps.version.outputs.VERSION }}.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "LUKS Attendance v${{ steps.version.outputs.VERSION }}"
          body: "v${{ steps.version.outputs.VERSION }} (build ${{ steps.version.outputs.SHA }}) — Download the .exe below. No installation needed, just run it."
          files: ./publish/LUKS-Attendance_v${{ steps.version.outputs.VERSION }}.exe
          make_latest: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUKS-Attendance_v${{ steps.version.outputs.VERSION }}
          path: ./publish/LUKS-Attendance_v${{ steps.version.outputs.VERSION }}.exe
